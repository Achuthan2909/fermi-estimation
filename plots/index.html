# Fermi Estimation<br>Fine-Tuning Pipeline

## DS595 — Final Project

### Achuthan Rathinam · Ria Sonalker · George Jr. Escobar · Puchen Liu

---

# What We Targeted — and Why

A **Fermi estimation** is a back-of-the-envelope calculation to estimate the *order of magnitude* of a seemingly impossible quantity.

Named after Enrico Fermi — "How many piano tuners are in Chicago?"

.cols[
.col-half[
**Why it matters**
- Engineering feasibility checks
- Market sizing in tech interviews
- Scientific sanity checks

**Why LLMs struggle**
- No physical intuition — only token statistics
- Error compounds across sub-steps
- Trained to be "precise", not calibrated
]
.col-half[
.highlight[
**Example question:**

*"How many femtojoules are in a petajoule?"*

Gold OOM: **30** — but the model must *reason* there, not recall it.
]

.highlight-red[
The model can recall facts but can't **feel** that 10³⁰ is unreasonably large.
]
]
]

---

class: center, middle, section-slide

# Evaluation Design

---

# Dataset

.cols[
.col-half[
**Master dataset: 5,008 questions**

Integrated from four sources:

| Source | Type |
|--------|------|
| Science Olympiad (scioly) | Competition Qs |
| FermiP (realFP) | Real-world Qs |
| FermiQ (fermiq) | Physics/sci Qs |
| Student traces | Model-generated reasoning |
| ~~SynthFP~~ | ~~Synthetic Qs (removed)~~ |

Splits: **Train / Val / Eval**
- Train: ~2,815 questions (SFT + RL)
- Val: 1,693 questions (monitoring only)
- Eval: 500 questions (held out, final reporting)
- SynthFP-free eval: **320 questions** (cleanest signal)
]
.col-half[
.highlight[
**Why SynthFP-free matters**

The paper introducing the FermiQ dataset flagged synthFP questions as having **unreliable ground truths** — systematic errors in the provided OOM labels.

Removing 180 synthetic questions revealed **true fine-tuning gains** of +0.058 vs. a masked +0.008 on the full set.
]

.highlight-purple[
**What "OOM" means:**

Gold OOM = floor(log₁₀(answer))

*"How many mL in a cubic meter?"* → answer = 10⁶ → gold OOM = **6**
]
]
]

---

# Scoring & Prompt Contract

.cols[
.col-60[
**FP Score** (lenient, eval)

.eq-box[score = max(0, 1 − δ / 3.0)]

**RL OOM Score** (strict, training)

.eq-box[score = max(0, 1 − δ / 1.5)]

where **δ = |log₁₀(pred) − gold OOM|**

- 1.0 = exact match · 0.0 at ±3 decades (eval) / ±1.5 (RL)

**Prompt Contract** — model must output a single JSON object with `factors`, `formula`, `calculation`, `final.oom`, `confidence`. Machine-parseable and human-auditable.
]
.col-40[
**Example trace** (from training data):

.center.w-100.shadow[![Trace example](trace_example.png)]
]
]

# Training Pipeline

---

# Pipeline Overview

**Data preparation**

.pipe[
  .pbox.p1[Raw Dataset .sub[5K Qs · fix ground truths]]
  .parr[→]
  .pbox.p2[Fact File .sub[Claude + web search · ~500 facts]]
  .parr[→]
  .pbox.p3[Verification .sub[Qwen3-30B checks answers]]
  .parr[→]
  .pbox.p4[Reasoning Traces .sub[Qwen3-30B generates JSON]]
  .parr[→]
  .pbox.p5[SFT Dataset .sub[Verified traces → examples]]
]

**Training**

.pipe[
  .pbox.p5[SFT Dataset .sub[Structured reasoning examples]]
  .parr[→]
  .pbox.p6[SFT .sub[Qwen3-4B · LoRA rank 32 · ~140 steps]]
  .parr[→]
  .pbox.p7[GRPO (RL v2) .sub[Reward-based · 250 steps · group=4]]
  .parr[→]
  .pbox.p1[Final Model .sub[SFT+RL checkpoint]]
]

.cols[
.col-half[
**Key design choices**
- Ground truths corrected before any training
- Fact file prevents hallucination in verification
- Same model for verification + trace generation — consistent format
]
.col-half[
**Model**
- Fine-tuned: **Qwen3-4B-Instruct-2507** via LoRA (rank 32)
- Data generation: Qwen3-30B-A3B (not fine-tuned)
- Training platform: Tinker
]
]

---

# SFT Training Dynamics

.center.w-90.shadow[![SFT loss + val score overlay](sft_loss_val_overlay.png)]

Training loss decreases steadily. Val score rises from **0.594 → 0.617 → 0.691** across checkpoints — confirming generalisation, not memorisation.

---

# GRPO Reward Function

.cols[
.col-half[
**Reward formula (RL v2)**

.eq-box[
reward = 0.85 × oom_score<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; + 0.15 × struct_score
]

- `struct_score` = (has\_factors + has\_calc + has\_formula) / 3
- Tail OOM multiplier: **×1.3** if gold OOM ≤ −4 or ≥ 10
- Parse fail → **−1.0** (hard penalty)

**Why 0.85/0.15?**

After SFT, structural quality is near-perfect (~75% parse OK at RL start → 97% at end). Shifting weight to accuracy concentrates gradient where improvement is still possible.
]
.col-half[
**RL runs**

| Run | Steps | Start | Final | Reward fn |
|-----|------:|------:|------:|-----------|
| RL v1 | 139 | 0.462 | 0.663 | δ/3.0, w=0.70/0.30 |
| RL v2 | 250 | 0.216 | **0.567** ✓ | δ/1.5, w=0.85/0.15 |
| RL v3 | 78 💥 | 0.282 | 0.361 | v2 + tail oversample |

.highlight[
**Why v1 starts higher than v2:** Different reward scales — not directly comparable. v1 uses lenient scoring (δ/3.0); v2 is stricter (δ/1.5). The same model response scores lower under v2. Both start from the same SFT checkpoint.
]

.highlight-red[
**RL v3 crash:** Oversampling tail OOMs (50%) without increasing `group_size` from 4 tripled zero-gradient batches (12.5% → 37.5%), collapsing reward.
]
]
]

# Results

---

# Key Results — SynthFP-Free Eval (n=320)

Baseline = Qwen3-4B-Instruct-2507, no fine-tuning &nbsp;·&nbsp; Finetuned = SFT + GRPO (RL v2)

| Metric | Baseline | Finetuned | Δ |
|--------|--------:|----------:|:--|
| Mean score | 0.516 | **0.574** | .pos[+0.058] |
| Exact OOM accuracy | 32.5% | **39.4%** | .pos[+6.9%] |
| Within 1 decade | 55.9% | **63.8%** | .pos[+7.9%] |
| Within 2 decades | 68.8% | **74.4%** | .pos[+5.6%] |
| Parse OK | 95.3% | **99.4%** | .pos[+4.1%] |
| Score = 0 (complete fail) | 25.0% | **22.5%** | .pos[−2.5%] |

.highlight[
Gains are much larger on the **SynthFP-free eval** (+0.058) than on the full 1,693-row val set (+0.008, SFT mean 0.518 vs RL v2 mean 0.526) — synthetic questions inflated the baseline score because the base model likely saw them during pretraining.
]

---

# RL Training Curves — All Runs

.center.w-100.shadow[![RL all runs reward and KL](rl_all_runs_curves.png)]

.small[**Left:** Reward rises strongly in RL v1 and v2; v3 collapses after step 40. **Right:** KL stays low in v1 and v2 (model stays close to SFT base); v3 KL grows as the policy destabilises. Note the reward scales differ between v1 and v2 due to the stricter δ/1.5 scoring used in v2.]

---

# Performance by OOM Range

.center.w-100.shadow[![SFT vs RL by OOM bucket](sft_vs_rl_by_oom_bucket.png)]

Model performs best on everyday-scale questions (OOM −3 to 9). Performance degrades sharply at extremes — **Very High OOM (≥20) has a 48.5% zero-score rate**.

---

# Error Rate by OOM

.center.w-90.shadow[![Error rate SFT vs RL](error_rate_sft_vs_rl.png)]

RL v2 reduces error rate in the everyday range. Minimal improvement at extreme OOMs — **zero-gradient problem**: all 4 GRPO rollouts score 0 → no learning signal.

---

class: center, middle, section-slide

# Conclusions

---

# What Worked

.cols[
.col-half[
.highlight-green[
**SFT**
- +6.6% parse OK (92.2% → 98.8%)
- Structured reasoning format learned reliably
- Val score 0.518 → 0.691 over training
]

.highlight-green[
**GRPO (RL v2)**
- +7.9% within-1-decade on clean eval
- +4.1% parse OK on top of SFT
- Mean score 0.516 → 0.574 (baseline → finetuned)
]
]
.col-half[
.highlight-green[
**Data pipeline**
- Fact grounding reduced noisy ground truths
- Verification + trace generation from Qwen3-30B produced high-quality SFT examples
]

.highlight-green[
**SynthFP removal**
- Revealed true gains hidden by memorised synthetic questions
- Clean eval showed +0.058 vs. masked +0.008
]
]
]

---

# What Didn't & Future Directions

.cols[
.col-half[
.highlight-red[
**What didn't work**
- Tail OOM accuracy remains poor (48.5% zero-score for ≥20)
- Confidence is uncalibrated — equally wrong at high/medium confidence
- RL v3: tail OOM oversampling without larger group size caused reward collapse
- Model confidently wrong on knowledge-gap questions
]
]
.col-half[
.highlight-purple[
**Future directions**
- Increase GRPO `group_size` to 8 to fix zero-gradient problem on tail OOMs
- SFT pass specifically on tail OOM questions
- Confidence calibration penalty in reward
- Multi-step self-verification: model checks own answer before committing
- Per-domain targeted training
]
]
]

.footnote[DS595 Spring 2026 · Achuthan Rathinam · Ria Sonalker · George Jr. Escobar · Puchen Liu]

    <script>
      var slideshow = remark.create({
        ratio: '16:9',
        highlightStyle: 'github',
        highlightLines: true,
        countIncrementalSlides: false,
        navigation: { scroll: false }
      });

      // Annotation system
      (function() {
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('drawing-indicator');
        let isDrawing = false, drawingMode = false, lastX = 0, lastY = 0;
        let currentSlideIdx = 0, canvasDirty = false;
        const annotations = {};

        function setupCanvas() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.lineWidth = 3; ctx.strokeStyle = '#ef4444';
        }

        function saveAnnotations() {
          if (canvasDirty) annotations[currentSlideIdx] = canvas.toDataURL();
        }

        function restoreAnnotations(slideIdx) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
          ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
          ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='#ef4444';
          canvasDirty = false;
          if (annotations[slideIdx]) {
            const img = new Image(), target = slideIdx;
            img.onload = function() {
              if (currentSlideIdx !== target) return;
              ctx.setTransform(1,0,0,1,0,0);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              ctx.scale(dpr,dpr);
            };
            img.src = annotations[slideIdx];
          }
        }

        canvas.addEventListener('mousedown', e => {
          if (!drawingMode) return;
          isDrawing = true; lastX = e.clientX; lastY = e.clientY;
        });
        canvas.addEventListener('mousemove', e => {
          if (!isDrawing || !drawingMode) return;
          ctx.beginPath(); ctx.moveTo(lastX, lastY);
          ctx.lineTo(e.clientX, e.clientY); ctx.stroke();
          lastX = e.clientX; lastY = e.clientY; canvasDirty = true;
        });
        canvas.addEventListener('mouseup', () => { if (isDrawing) { isDrawing=false; saveAnnotations(); } });
        canvas.addEventListener('mouseout', () => { if (isDrawing) { isDrawing=false; saveAnnotations(); } });

        window.addEventListener('resize', () => { saveAnnotations(); setupCanvas(); restoreAnnotations(currentSlideIdx); });

        document.addEventListener('keydown', e => {
          if (e.key==='d'||e.key==='D') {
            drawingMode=!drawingMode;
            canvas.classList.toggle('drawing',drawingMode);
            indicator.classList.toggle('visible',drawingMode);
            e.stopPropagation();
          } else if ((e.key==='x'||e.key==='X') && drawingMode) {
            const dpr=window.devicePixelRatio||1;
            ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.scale(dpr,dpr);
            delete annotations[currentSlideIdx]; canvasDirty=false; e.stopPropagation();
          }
        });

        function checkSlide() {
          const newIdx = slideshow.getCurrentSlideIndex();
          if (newIdx !== currentSlideIdx) {
            saveAnnotations(); if(isDrawing) isDrawing=false;
            currentSlideIdx = newIdx; restoreAnnotations(currentSlideIdx);
          }
        }
        document.addEventListener('keyup', checkSlide);
        document.addEventListener('click', checkSlide);
        slideshow.on('hideSlide', saveAnnotations);
        slideshow.on('showSlide', s => { currentSlideIdx=s.getSlideIndex(); restoreAnnotations(currentSlideIdx); });

        currentSlideIdx = slideshow.getCurrentSlideIndex();
        setupCanvas();
      })();
    </script>
